name: Prepare LOT-0002

on:
  push:
    branches:
      - agent/lot-0002-publication
    paths:
      - .github/lot-0002-payload.tar.gz.b64
      - .github/workflows/prepare-lot-0002.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/lot-0002-publication
          fetch-depth: 0

      - name: Verify and extract authorized payload
        shell: bash
        run: |
          set -euo pipefail
          echo "5778562115b68c757db741a7f1ea3f84b177fe9326f3c732b4ac4fcb0f75eafb  .github/lot-0002-payload.tar.gz.b64" | sha256sum --check --strict
          base64 --decode .github/lot-0002-payload.tar.gz.b64 > /tmp/lot-0002-payload.tar.gz
          echo "46b8c81d39d7312635c94ce9ae4b837e211d4f3d4bbe26c8ff9608f624ec90d5  /tmp/lot-0002-payload.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/lot-0002-payload.tar.gz | sort
          tar -xzf /tmp/lot-0002-payload.tar.gz -C .
          echo "7c3ad696f5704afe6543f457e4fe47cad38a36b8a0df1f413a892804597f2d58  content/catalog.json" | sha256sum --check --strict
          test "$(wc -c < content/catalog.json)" -eq 37178

      - name: Validate cumulative catalog
        run: npm run check

      - name: Confirm exact final scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/lot-0002-payload.tar.gz.b64
          rm .github/workflows/prepare-lot-0002.yml
          git add -A
          git diff --cached --name-only | sort > /tmp/changed-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          .github/lot-0002-payload.tar.gz.b64
          .github/workflows/prepare-lot-0002.yml
          README.md
          content/catalog.json
          content/manifest.json
          tests/lot-0001-publication.test.mjs
          tests/lot-0002-publication.test.mjs
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt

      - name: Commit authorized export candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: exportar LOT-0002 com a segunda unidade"
          git push origin HEAD:agent/lot-0002-publication
