name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate public content
        run: npm run check

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble cumulative catalog
        run: npm run assemble
      - name: Generate deployment metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { buildCoverageSummary } from './scripts/check-competition-coverage.mjs';
          const catalog = JSON.parse(await readFile('content/catalog.json', 'utf8'));
          const applicability = JSON.parse(await readFile('content/content-applicability.json', 'utf8'));
          const coverage = buildCoverageSummary(catalog, applicability);
          const metadata = {
            schemaVersion: 2,
            deployedAt: new Date().toISOString(),
            commitSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            contentVersion: catalog.contentVersion,
            lotId: catalog.publication?.lotId ?? null,
            status: 'published',
            coverage
          };
          await writeFile('content/deployment.json', `${JSON.stringify(metadata, null, 2)}\n`);
          NODE
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -R ./*.html assets content .nojekyll _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Assemble expected cumulative catalog
        run: npm run assemble
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Validate public deployment
        id: smoke
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run deployment:check -- "$PAGE_URL"
      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            STATE="success"
            DESCRIPTION="GitHub Pages e cobertura multi-concurso validados."
          else
            STATE="failure"
            DESCRIPTION="Falha na validação pública ou na cobertura multi-concurso."
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="pages-smoke" \
            -f description="$DESCRIPTION" \
            -f target_url="$TARGET_URL"
