name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install browser test dependency
        run: npm install --ignore-scripts --no-save --no-package-lock @playwright/test@1.61.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate and test
        run: npm run check
      - name: Test authenticated browser flows
        run: npm run test:e2e
